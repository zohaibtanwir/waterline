User tinyproxy
Group tinyproxy
Port 8888
Listen 100.98.245.52
Timeout 600
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Connect
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50

# Only tailnet peers may use this proxy (runner + sandboxes route via runner)
Allow 100.64.0.0/10

# HTTPS tunneling only to standard TLS port
ConnectPort 443

# Deny everything not on the allowlist
Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterDefaultDeny Yes
FilterExtended On
