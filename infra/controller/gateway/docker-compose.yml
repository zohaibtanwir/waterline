# LiteLLM gateway stack — waterline controller (tailnet + sandbox-net reachable)
# Deploy to: /opt/waterline-repo/infra/controller/gateway/ on waterline-control
#
# Image PINNED (never :latest / :main-stable) — the litellm-database image is
# required for virtual keys + spend tracking. v1.89.0: past the Mar-2026 supply
# chain incident, includes Claude Opus 4.8 adaptive-thinking routing.
services:
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.89.0
    restart: unless-stopped
    depends_on:
      litellm-db: { condition: service_healthy }
    ports:
      - "100.98.245.52:4000:4000"        # admin + model endpoint over tailnet
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}         # the ONE real key (waterline-gateway)
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}       # sk-... admin key
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}           # encrypts stored keys; MUST persist across redeploys
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://100.98.245.52:3000
      STORE_MODEL_IN_DB: "True"

  litellm-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm_postgres:/var/lib/postgresql/data

volumes:
  litellm_postgres:
